# AgentGrid — default stack uses Redis + SQLite (volume).
# Scale coding workers that share the Redis queue:
#   docker compose up --build --scale worker=2
#
# Optional Postgres (profile "postgres") — do not start default api/worker
# alongside api-pg/worker-pg on the same host port:
#   docker compose --profile postgres up --build api-pg worker-pg postgres redis

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  postgres:
    profiles: ["postgres"]
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: agentgrid
      POSTGRES_PASSWORD: agentgrid
      POSTGRES_DB: agentgrid
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentgrid -d agentgrid"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    command: uvicorn agentgrid.main:app --host 0.0.0.0 --port 8000
    environment:
      AGENTGRID_DATABASE_URL: sqlite:////data/agentgrid.db
      AGENTGRID_REDIS_URL: redis://redis:6379/0
      AGENTGRID_USE_REDIS: "1"
      AGENTGRID_API_TOKEN: dev-token
      AGENTGRID_ARTIFACT_DIR: /data/artifacts
      AGENTGRID_SANDBOX_ROOT: /app/sandbox
      AGENTGRID_JOB_TIMEOUT_S: "120"
      AGENTGRID_VERIFY_TIMEOUT_S: "30"
      PYTHONPATH: /app/backend
    ports:
      - "8000:8000"
    volumes:
      - agdata:/data
    depends_on:
      - redis

  # Postgres-backed API (profile). Same host port 8000 as `api` — pick one stack.
  api-pg:
    profiles: ["postgres"]
    build: .
    command: uvicorn agentgrid.main:app --host 0.0.0.0 --port 8000
    environment:
      AGENTGRID_DATABASE_URL: postgresql+psycopg://agentgrid:agentgrid@postgres:5432/agentgrid
      AGENTGRID_REDIS_URL: redis://redis:6379/0
      AGENTGRID_USE_REDIS: "1"
      AGENTGRID_API_TOKEN: dev-token
      AGENTGRID_ARTIFACT_DIR: /data/artifacts
      AGENTGRID_SANDBOX_ROOT: /app/sandbox
      AGENTGRID_JOB_TIMEOUT_S: "120"
      AGENTGRID_VERIFY_TIMEOUT_S: "30"
      PYTHONPATH: /app/backend
    ports:
      - "8000:8000"
    volumes:
      - agdata:/data
    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_healthy

  # Scale with: docker compose up --scale worker=N
  worker:
    build: .
    command: python -m agentgrid.workers.coding_worker
    environment:
      AGENTGRID_DATABASE_URL: sqlite:////data/agentgrid.db
      AGENTGRID_REDIS_URL: redis://redis:6379/0
      AGENTGRID_USE_REDIS: "1"
      AGENTGRID_API_TOKEN: dev-token
      AGENTGRID_ARTIFACT_DIR: /data/artifacts
      AGENTGRID_SANDBOX_ROOT: /app/sandbox
      AGENTGRID_JOB_TIMEOUT_S: "120"
      AGENTGRID_VERIFY_TIMEOUT_S: "30"
      PYTHONPATH: /app/backend
    volumes:
      - agdata:/data
    depends_on:
      - redis
      - api

  worker-pg:
    profiles: ["postgres"]
    build: .
    command: python -m agentgrid.workers.coding_worker
    environment:
      AGENTGRID_DATABASE_URL: postgresql+psycopg://agentgrid:agentgrid@postgres:5432/agentgrid
      AGENTGRID_REDIS_URL: redis://redis:6379/0
      AGENTGRID_USE_REDIS: "1"
      AGENTGRID_API_TOKEN: dev-token
      AGENTGRID_ARTIFACT_DIR: /data/artifacts
      AGENTGRID_SANDBOX_ROOT: /app/sandbox
      AGENTGRID_JOB_TIMEOUT_S: "120"
      AGENTGRID_VERIFY_TIMEOUT_S: "30"
      PYTHONPATH: /app/backend
    volumes:
      - agdata:/data
    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_healthy
      api-pg:
        condition: service_started

volumes:
  agdata:
  pgdata:
